<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('员工入职')" />
    <th:block th:include="include :: select2-css" />
    <th:block th:include="include :: datetimepicker-css" />
</head>
<body>
<div class="main-content">
    <form id="form-user-add" class="form-horizontal">
        <input name="deptId" type="hidden" id="treeId"/>
        <h4 class="form-header h4">基础信息</h4>
        <div class="row">
            <div class="col-sm-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label is-required">姓名：</label>
                    <div class="col-sm-8">
                        <input name="userName" placeholder="请输入姓名" class="form-control" type="text" maxlength="30" required>
                    </div>
                </div>
            </div>
            <div class="col-sm-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label">归属部门：</label>
                    <div class="col-sm-8">
                        <div class="input-group">
                            <input name="deptName" onclick="selectDeptTree()" id="treeName" type="text" placeholder="请选择归属部门" class="form-control">
                            <span class="input-group-addon"><i class="fa fa-search"></i></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-sm-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label">手机号码：</label>
                    <div class="col-sm-8">
                        <div class="input-group">
                            <input id="phonenumber" name="phonenumber" placeholder="请输入手机号" class="form-control" type="text" maxlength="11">
                            <span class="input-group-addon"><i class="fa fa-mobile"></i></span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-sm-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label is-required">入职日期：</label>
                    <div class="col-sm-8">
                        <input id="entryDate" name="entryDate" class="form-control time-input" type="text" placeholder="yyyy-MM-dd" required>
                    </div>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-sm-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label">邮箱：</label>
                    <div class="col-sm-8">
                        <div class="input-group">
                            <input id="email" name="email" class="form-control email" type="text" maxlength="50" placeholder="请输入邮箱">
                            <span class="input-group-addon"><i class="fa fa-envelope"></i></span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-sm-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label is-required">登录密码：</label>
                    <div class="col-sm-8">
                        <div class="input-group">
                            <input id="password" name="password" placeholder="请输入登录密码" class="form-control" type="password" th:value="${@config.getKey('sys.user.initPassword')}" required>
                            <span class="input-group-addon" title="登录密码，鼠标按下显示密码"
                                  onmousedown="$('#password').attr('type','text')"
                                  onmouseup="$('#password').attr('type','password')"><i class="fa fa-key"></i></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-sm-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label is-required">工号：</label>
                    <div class="col-sm-8">
                        <input id="loginName" name="loginName" placeholder="请输入工号" class="form-control" type="text" maxlength="30" required>
                    </div>
                </div>
            </div>
            <div class="col-sm-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label">用户状态：</label>
                    <div class="col-sm-8">
                        <label class="toggle-switch switch-solid">
                            <input type="checkbox" id="status" checked>
                            <span></span>
                        </label>
                    </div>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-sm-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label">用户性别：</label>
                    <div class="col-sm-8">
                        <select name="sex" class="form-control m-b" th:with="type=${@dict.getType('sys_user_sex')}">
                            <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}"></option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-sm-12">
                <div class="form-group">
                    <label class="col-xs-2 control-label">岗位：</label>
                    <div class="col-xs-4">
                        <select id="post" class="form-control select2-multiple" multiple>
                            <option th:each="post:${posts}" th:value="${post.postId}" th:text="${post.postName}" th:disabled="${post.status == '1'}"></option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-sm-12">
                <div class="form-group">
                    <label class="col-xs-2 control-label">角色：</label>
                    <div class="col-xs-10">
                        <label th:each="role:${roles}" class="check-box">
                            <input name="role" type="checkbox" th:value="${role.roleId}" th:text="${role.roleName}" th:disabled="${role.status == '1'}">
                        </label>
                    </div>
                </div>
            </div>
        </div>
        <h4 class="form-header h4">其他信息</h4>
        <div class="row">
            <div class="col-sm-12">
                <div class="form-group">
                    <label class="col-xs-2 control-label">备注：</label>
                    <div class="col-xs-10">
                        <textarea name="remark" maxlength="500" class="form-control" rows="3"></textarea>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>
<div class="row">
    <div class="col-sm-offset-5 col-sm-10">
        <button type="button" class="btn btn-sm btn-primary" onclick="submitHandler()"><i class="fa fa-check"></i> 保存</button>&nbsp;
        <button type="button" class="btn btn-sm btn-danger" onclick="closeItem()"><i class="fa fa-reply-all"></i> 关闭</button>
    </div>
</div>
<th:block th:include="include :: footer" />
<th:block th:include="include :: select2-js" />
<th:block th:include="include :: datetimepicker-js" />
<script>
    var prefix = ctx + "system/user";

    $(function () {
        $('#post').select2({ placeholder: '请选择岗位', allowClear: true });
        $('#entryDate').datetimepicker({
            format: 'yyyy-mm-dd',
            minView: 'month',
            autoclose: true
        });

        $('#form-user-add').validate({
            onkeyup: false,
            rules: {
                loginName: {
                    minlength: 2,
                    maxlength: 20,
                    remote: {
                        url: prefix + '/checkLoginNameUnique',
                        type: 'post',
                        dataType: 'json',
                        data: {
                            loginName: function () {
                                return $.common.trim($('#loginName').val());
                            }
                        }
                    }
                },
                password: {
                    minlength: 5,
                    maxlength: 20,
                    specialSign: true
                },
                email: {
                    email: true,
                    remote: {
                        url: prefix + '/checkEmailUnique',
                        type: 'post',
                        dataType: 'json',
                        data: {
                            email: function () {
                                return $.common.trim($('#email').val());
                            }
                        }
                    }
                },
                phonenumber: {
                    isPhone: true,
                    remote: {
                        url: prefix + '/checkPhoneUnique',
                        type: 'post',
                        dataType: 'json',
                        data: {
                            phonenumber: function () {
                                return $.common.trim($('#phonenumber').val());
                            }
                        }
                    }
                }
            },
            messages: {
                loginName: { remote: '工号已经存在' },
                email: { remote: '邮箱已经存在' },
                phonenumber: { remote: '手机号已经存在' }
            },
            focusCleanup: true
        });
    });

    function submitHandler() {
        var chrtype = [[${#strings.defaultString(@config.getKey('sys.account.chrtype'), 0)}]];
        var password = $('#password').val();
        if ($.validate.form() && checkpwd(chrtype, password)) {
            var data = $('#form-user-add').serializeArray();
            var status = $('#status').is(':checked') ? 0 : 1;
            var roleIds = $.form.selectCheckeds('role');
            var postIds = $.form.selectSelects('post');
            data.push({ name: 'status', value: status });
            data.push({ name: 'roleIds', value: roleIds });
            data.push({ name: 'postIds', value: postIds });
            $.operate.saveTab(prefix + '/add', data);
        }
    }

    function selectDeptTree() {
        var deptId = $.common.isEmpty($('#treeId').val()) ? '100' : $('#treeId').val();
        var url = ctx + 'system/user/selectDeptTree/' + deptId;
        var btn = ['<i class="fa fa-check"></i> 确认', '<i class="fa fa-trash-o"></i> 清除', '<i class="fa fa-close"></i> 关闭'];
        $.modal.openOptions({
            title: '选择部门',
            width: '380',
            url: url,
            btn: btn,
            btn2: function(index) {
                $('#treeId').val('');
                $('#treeName').val('');
                $.modal.close(index);
            },
            callBack: doSubmit
        });
    }

    function doSubmit(index, layero) {
        var body = $.modal.getChildFrame(index);
        $('#treeId').val(body.find('#treeId').val());
        $('#treeName').val(body.find('#treeName').val());
        $.modal.close(index);
    }
</script>
</body>
</html>
