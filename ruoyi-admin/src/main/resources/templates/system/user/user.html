<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('员工列表')" />
    <th:block th:include="include :: layout-latest-css" />
    <th:block th:include="include :: ztree-css" />
</head>
<body class="gray-bg">
<div class="ui-layout-west">
    <div class="box box-main">
        <div class="box-header">
            <div class="box-title"><i class="fa fa-sitemap"></i> 组织机构</div>
            <div class="box-tools pull-right">
                <a type="button" class="btn btn-box-tool" href="javascript:void(0)" onclick="dept()" title="管理部门"><i class="fa fa-edit"></i></a>
                <button type="button" class="btn btn-box-tool" id="btnExpand" title="展开" style="display:none;"><i class="fa fa-chevron-up"></i></button>
                <button type="button" class="btn btn-box-tool" id="btnCollapse" title="折叠"><i class="fa fa-chevron-down"></i></button>
                <button type="button" class="btn btn-box-tool" id="btnRefresh" title="刷新部门"><i class="fa fa-refresh"></i></button>
            </div>
        </div>
        <div class="ui-layout-content">
            <div id="tree" class="ztree"></div>
        </div>
    </div>
</div>

<div class="ui-layout-center">
    <div class="container-div">
        <div class="row">
            <div class="col-sm-12 search-collapse">
                <form id="user-form">
                    <input type="hidden" id="deptId" name="deptId">
                    <input type="hidden" id="parentId" name="parentId">
                    <div class="select-list">
                        <ul>
                            <li>工号：<input type="text" name="loginName"/></li>
                            <li>手机号码：<input type="text" name="phonenumber"/></li>
                            <li>
                                用户状态：
                                <select name="status" th:with="type=${@dict.getType('sys_normal_disable')}">
                                    <option value="">所有</option>
                                    <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}"></option>
                                </select>
                            </li>
                            <li>
                                在职状态：
                                <select name="params[workStatus]" th:with="type=${@dict.getType('hr_employee_work_status')}">
                                    <option value="">所有</option>
                                    <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}"></option>
                                </select>
                            </li>
                            <li class="select-time">
                                <label>创建时间：</label>
                                <input type="text" class="time-input" id="startTime" placeholder="开始时间" name="params[beginTime]"/>
                                <span>-</span>
                                <input type="text" class="time-input" id="endTime" placeholder="结束时间" name="params[endTime]"/>
                            </li>
                            <li>
                                <a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search('user-form')"><i class="fa fa-search"></i>&nbsp;搜索</a>
                                <a class="btn btn-warning btn-rounded btn-sm" onclick="resetPre()"><i class="fa fa-refresh"></i>&nbsp;重置</a>
                            </li>
                        </ul>
                    </div>
                </form>
            </div>

            <div class="btn-group-sm" id="toolbar" role="group">
                <a class="btn btn-success" onclick="$.operate.addTab()" shiro:hasPermission="system:user:add">
                    <i class="fa fa-plus"></i> 入职
                </a>
                <a class="btn btn-primary single disabled" onclick="$.operate.editTab()" shiro:hasPermission="system:user:edit">
                    <i class="fa fa-edit"></i> 修改
                </a>
                <a class="btn btn-warning single disabled" onclick="leaveUserBySelection()" shiro:hasPermission="system:user:edit">
                    <i class="fa fa-sign-out"></i> 离职
                </a>
                <a class="btn btn-info" onclick="$.table.importExcel()" shiro:hasPermission="system:user:import">
                    <i class="fa fa-upload"></i> 导入
                </a>
                <a class="btn btn-warning" onclick="$.table.exportExcel()" shiro:hasPermission="system:user:export">
                    <i class="fa fa-download"></i> 导出
                </a>
            </div>

            <div class="col-sm-12 select-table table-striped">
                <table id="bootstrap-table"></table>
            </div>
        </div>
    </div>
</div>

<th:block th:include="include :: footer" />
<th:block th:include="include :: layout-latest-js" />
<th:block th:include="include :: ztree-js" />
<script th:inline="javascript">
    var editFlag = [[${@permission.hasPermi('system:user:edit')}]];
    var resetPwdFlag = [[${@permission.hasPermi('system:user:resetPwd')}]];
    var sexData = [[${@dict.getType('sys_user_sex')}]];
    var prefix = ctx + "system/user";

    $(function() {
        var paneHidden = $(window).width() < 769;
        $('body').layout({ initClosed: paneHidden, west__size: 185, resizeWithWindow: false });
        if ($.fn.toTop !== undefined) {
            $('#scroll-up').toTop({ win: $('.ui-layout-center'), doc: $('.ui-layout-center') });
        }
        queryUserList();
        queryDeptTree();
    });

    function queryUserList() {
        var options = {
            url: prefix + "/list",
            viewUrl: prefix + "/view/{id}",
            createUrl: prefix + "/add",
            updateUrl: prefix + "/edit/{id}",
            exportUrl: prefix + "/export",
            importUrl: prefix + "/importData",
            importTemplateUrl: prefix + "/importTemplate",
            modalName: "员工",
            columns: [{
                checkbox: true
            }, {
                field: 'userId',
                title: '用户ID'
            }, {
                field: 'loginName',
                title: '工号',
                sortable: true,
                formatter: function(value, row) {
                    return '<a href="javascript:void(0)" onclick="$.operate.view(\'' + row.userId + '\')">' + value + '</a>';
                }
            }, {
                field: 'userName',
                title: '姓名'
            }, {
                field: 'dept.deptName',
                title: '部门'
            }, {
                field: 'sex',
                title: '性别',
                formatter: function(value) {
                    return $.table.selectDictLabel(sexData, value);
                }
            }, {
                field: 'phonenumber',
                title: '手机'
            }, {
                field: 'leaveDate',
                title: '离职日期',
                formatter: function(value) {
                    return $.common.isEmpty(value) ? '-' : value;
                }
            }, {
                title: '在职状态',
                align: 'center',
                formatter: function(value, row) {
                    if ($.common.isEmpty(row.leaveDate)) {
                        return '<span class="label label-primary">在职</span>';
                    }
                    return '<span class="label label-warning">已离职</span>';
                }
            }, {
                visible: editFlag == 'hidden' ? false : true,
                title: '用户状态',
                align: 'center',
                formatter: function(value, row) {
                    return statusTools(row);
                }
            }, {
                field: 'createTime',
                title: '创建时间',
                sortable: true
            }, {
                title: '操作',
                align: 'center',
                formatter: function(value, row) {
                    if (row.userId == 1) {
                        return '';
                    }
                    var actions = [];
                    actions.push('<a class="btn btn-success btn-xs ' + editFlag + '" href="javascript:void(0)" onclick="$.operate.editTab(\'' + row.userId + '\')"><i class="fa fa-edit"></i>编辑</a> ');
                    actions.push('<a class="btn btn-warning btn-xs ' + editFlag + '" href="javascript:void(0)" onclick="leaveUser(' + row.userId + ')"><i class="fa fa-sign-out"></i>离职</a> ');
                    var more = [];
                    more.push("<a class='btn btn-default btn-xs " + resetPwdFlag + "' href='javascript:void(0)' onclick='resetPwd(" + row.userId + ")'><i class='fa fa-key'></i>重置密码</a> ");
                    more.push("<a class='btn btn-default btn-xs " + editFlag + "' href='javascript:void(0)' onclick='authRole(" + row.userId + ")'><i class='fa fa-check-square-o'></i>分配角色</a>");
                    actions.push('<a tabindex="0" class="btn btn-info btn-xs" role="button" data-container="body" data-placement="left" data-toggle="popover" data-html="true" data-trigger="hover" data-content="' + more.join('') + '"><i class="fa fa-chevron-circle-right"></i>更多操作</a>');
                    return actions.join('');
                }
            }]
        };
        $.table.init(options);
    }

    function queryDeptTree() {
        var options = {
            url: ctx + 'system/user/deptTreeData',
            expandLevel: 2,
            onClick: function(event, treeId, treeNode) {
                $('#deptId').val(treeNode.id);
                $('#parentId').val(treeNode.pId);
                $.table.search('user-form');
            }
        };
        $.tree.init(options);
    }

    $('#btnExpand').click(function() {
        $._tree.expandAll(true);
        $(this).hide();
        $('#btnCollapse').show();
    });

    $('#btnCollapse').click(function() {
        $._tree.expandAll(false);
        $(this).hide();
        $('#btnExpand').show();
    });

    $('#btnRefresh').click(function() {
        queryDeptTree();
    });

    function resetPre() {
        resetDate();
        $('#user-form')[0].reset();
        $('#deptId').val('');
        $('#parentId').val('');
        $('.curSelectedNode').removeClass('curSelectedNode');
        $.table.search('user-form');
    }

    function dept() {
        $.modal.openTab('部门管理', ctx + 'system/dept');
    }

    function resetPwd(userId) {
        $.modal.open('重置密码', prefix + '/resetPwd/' + userId, '800', '300');
    }

    function authRole(userId) {
        $.modal.openTab('用户分配角色', prefix + '/authRole/' + userId);
    }

    function leaveUser(userId) {
        $.modal.open('员工离职', prefix + '/leave/' + userId, '700', '420');
    }

    function leaveUserBySelection() {
        var userIds = $.table.selectColumns("userId");
        if (!userIds || userIds.length === 0) {
            $.modal.alertWarning('请先选择员工');
            return;
        }
        leaveUser(userIds[0]);
    }

    function statusTools(row) {
        if (row.status == 1) {
            return '<i class="fa fa-toggle-off text-info fa-2x" onclick="enable(\'' + row.userId + '\')"></i> ';
        }
        return '<i class="fa fa-toggle-on text-info fa-2x" onclick="disable(\'' + row.userId + '\')"></i> ';
    }

    function disable(userId) {
        $.modal.confirm('确认要停用该用户吗？', function() {
            $.operate.post(prefix + '/changeStatus', { userId: userId, status: 1 });
        });
    }

    function enable(userId) {
        $.modal.confirm('确认要启用该用户吗？', function() {
            $.operate.post(prefix + '/changeStatus', { userId: userId, status: 0 });
        });
    }
</script>
</body>
<script id="importTpl" type="text/template">
<form enctype="multipart/form-data" class="mt20 mb10">
    <div class="col-xs-offset-1">
        <input type="file" id="file" name="file"/>
        <div class="mt10 pt5">
            <input type="checkbox" id="updateSupport" name="updateSupport" title="如果登录账号已经存在，更新这条数据。"> 是否更新已经存在的用户数据
            &nbsp;
            <a onclick="$.table.importTemplate()" class="btn btn-default btn-xs"><i class="fa fa-file-excel-o"></i> 下载模板</a>
        </div>
        <font color="red" class="pull-left mt10">提示：仅允许导入“xls”或“xlsx”格式文件！</font>
    </div>
</form>
</script>
</html>
