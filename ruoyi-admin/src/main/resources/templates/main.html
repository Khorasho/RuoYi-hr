<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>欢迎页</title>
    <link rel="shortcut icon" href="favicon.ico">
    <link href="../static/css/bootstrap.min.css" th:href="@{/css/bootstrap.min.css}" rel="stylesheet"/>
    <link href="../static/css/font-awesome.min.css" th:href="@{/css/font-awesome.min.css}" rel="stylesheet"/>
    <link href="../static/css/style.min.css" th:href="@{/css/style.min.css}" rel="stylesheet"/>
    <style>
        .welcome-wrap { padding: 20px; }
        .hero {
            border-radius: 12px;
            padding: 24px;
            color: #fff;
            background: linear-gradient(135deg, #2f4050 0%, #1ab394 100%);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
            margin-bottom: 20px;
        }
        .hero h1 { margin: 0 0 10px; font-size: 28px; font-weight: 600; }
        .hero .meta { font-size: 15px; opacity: .95; }
        .card {
            background: #fff;
            border-radius: 10px;
            padding: 18px;
            min-height: 140px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            margin-bottom: 16px;
        }
        .card h3 { margin: 0 0 12px; font-size: 16px; color: #2f4050; font-weight: 600; }
        .big-time { font-size: 34px; font-weight: 600; color: #1ab394; line-height: 1.2; }
        .quick-links a { display: inline-block; margin: 0 8px 8px 0; }
        .tips-list { margin: 0; padding-left: 16px; color: #666; }
        .tips-list li { margin-bottom: 6px; }
    </style>
</head>
<body class="gray-bg">
<div class="welcome-wrap">
    <div class="hero">
        <h1 id="greeting">欢迎使用 HR 系统</h1>
        <div class="meta">
            <span>当前日期：</span><span id="todayDate">--</span>
        </div>
    </div>

    <div class="row">
        <div class="col-sm-4">
            <div class="card">
                <h3><i class="fa fa-clock-o"></i> 实时时间</h3>
                <div class="big-time" id="nowTime">--:--:--</div>
                <div id="weekday" style="color:#888; margin-top:6px;">--</div>
            </div>
        </div>
        <div class="col-sm-4">
            <div class="card">
                <h3><i class="fa fa-link"></i> 快捷入口</h3>
                <div class="quick-links">
                    <a class="btn btn-primary btn-sm" href="javascript:void(0)" onclick="openMenu('/hr/employeeSetting', '员工设置')">员工设置</a>
                    <a class="btn btn-success btn-sm" href="javascript:void(0)" onclick="openMenu('/hr/shift', '班次管理')">班次管理</a>
                    <a class="btn btn-warning btn-sm" href="javascript:void(0)" onclick="openMenu('/hr/schedule', '排班管理')">排班管理</a>
                    <a class="btn btn-info btn-sm" href="javascript:void(0)" onclick="openMenu('/hr/attendance', '考勤明细')">考勤明细</a>
                </div>
            </div>
        </div>
        <div class="col-sm-4">
            <div class="card">
                <h3><i class="fa fa-bell-o"></i> 今日提示</h3>
                <ul class="tips-list">
                    <li>建议先检查当日排班是否完整。</li>
                    <li>收班后可执行一次当日考勤重算。</li>
                    <li>导出报表前请确认筛选条件与时间范围。</li>
                </ul>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/js/jquery.min.js}"></script>
<script>
    function formatDate(date) {
        var y = date.getFullYear();
        var m = String(date.getMonth() + 1).padStart(2, '0');
        var d = String(date.getDate()).padStart(2, '0');
        return y + '-' + m + '-' + d;
    }

    function formatTime(date) {
        var h = String(date.getHours()).padStart(2, '0');
        var m = String(date.getMinutes()).padStart(2, '0');
        var s = String(date.getSeconds()).padStart(2, '0');
        return h + ':' + m + ':' + s;
    }

    function getWeekday(date) {
        var arr = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
        return arr[date.getDay()];
    }

    function getGreeting(hour) {
        if (hour < 6) return '凌晨好，开始新的一天';
        if (hour < 12) return '上午好，祝你工作顺利';
        if (hour < 14) return '中午好，注意休息';
        if (hour < 18) return '下午好，继续加油';
        return '晚上好，辛苦了';
    }

    function refreshClock() {
        var now = new Date();
        $('#todayDate').text(formatDate(now));
        $('#nowTime').text(formatTime(now));
        $('#weekday').text(getWeekday(now));
        $('#greeting').text(getGreeting(now.getHours()));
    }

    function openMenu(url, title) {
        var parentWin = window.parent;
        if (parentWin && parentWin.$) {
            var $links = parentWin.$('.menuItem').filter(function () {
                var href = parentWin.$(this).attr('href') || '';
                return href === url || href.indexOf(url) >= 0;
            });
            if ($links.length) {
                $links.eq(0).trigger('click');
                return;
            }
            if (parentWin.$.modal && parentWin.$.modal.openTab) {
                parentWin.$.modal.openTab(title || '菜单', url);
                return;
            }
        }
        window.location.href = url;
    }

    refreshClock();
    setInterval(refreshClock, 1000);
</script>
</body>
</html>
