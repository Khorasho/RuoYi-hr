<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('员工设置')"/>
    <th:block th:include="include :: datetimepicker-css"/>
</head>
<body class="white-bg">
<div class="main-content">
    <form id="form-employee-setting-edit" class="form-horizontal" th:object="${employeeSetting}">
        <input type="hidden" name="userId" th:field="*{userId}"/>
        <input type="hidden" id="attendanceEnabled" name="attendanceEnabled"
               th:value="${employeeSetting.attendanceEnabled == null ? '1' : employeeSetting.attendanceEnabled}"/>
        <input type="hidden" id="entryDate" name="entryDate"
               th:value="${employeeSetting.entryDate == null ? '' : #dates.format(employeeSetting.entryDate, 'yyyy-MM-dd')}"/>
        <input type="hidden" id="leaveDate" name="leaveDate"
               th:value="${employeeSetting.leaveDate == null ? '' : #dates.format(employeeSetting.leaveDate, 'yyyy-MM-dd')}"/>

        <h4 class="form-header h4">基础信息</h4>
        <div class="row">
            <div class="col-sm-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label">工号：</label>
                    <div class="col-sm-8">
                        <input type="text" class="form-control" th:value="*{loginName}" readonly>
                    </div>
                </div>
            </div>
            <div class="col-sm-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label">姓名：</label>
                    <div class="col-sm-8">
                        <input type="text" class="form-control" th:value="*{userName}" readonly>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-sm-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label">部门：</label>
                    <div class="col-sm-8">
                        <input type="text" class="form-control" th:value="*{deptName}" readonly>
                    </div>
                </div>
            </div>
            <div class="col-sm-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label">手机号：</label>
                    <div class="col-sm-8">
                        <input type="text" class="form-control" th:value="*{phonenumber}" readonly>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-sm-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label">入职日期：</label>
                    <div class="col-sm-8">
                        <input type="text" class="form-control"
                               th:value="${employeeSetting.entryDate == null ? '-' : #dates.format(employeeSetting.entryDate, 'yyyy-MM-dd')}" readonly>
                    </div>
                </div>
            </div>
            <div class="col-sm-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label">离职日期：</label>
                    <div class="col-sm-8">
                        <input type="text" class="form-control"
                               th:value="${employeeSetting.leaveDate == null ? '在职' : #dates.format(employeeSetting.leaveDate, 'yyyy-MM-dd')}" readonly>
                    </div>
                </div>
            </div>
        </div>

        <h4 class="form-header h4">班次设置</h4>
        <div class="row">
            <div class="col-sm-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label">轮班起算日：</label>
                    <div class="col-sm-8">
                        <input id="rotationAnchorDate" name="rotationAnchorDate" type="text" class="form-control time-input"
                               th:value="${employeeSetting.rotationAnchorDate == null ? '' : #dates.format(employeeSetting.rotationAnchorDate, 'yyyy-MM-dd')}"
                               placeholder="留空则默认按入职日期">
                        <span class="help-block m-b-none"><i class="fa fa-info-circle"></i> 默认班次为轮班模式时，用这个日期作为轮班起算点；留空则按入职日期。</span>
                    </div>
                </div>
            </div>
            <div class="col-sm-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label">参与考勤：</label>
                    <div class="col-sm-8">
                        <label class="toggle-switch switch-solid">
                            <input type="checkbox" id="attendanceEnabledSwitch"
                                   th:checked="${employeeSetting.attendanceEnabled == null or employeeSetting.attendanceEnabled == '1'}">
                            <span></span>
                        </label>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-sm-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label is-required">默认班次：</label>
                    <div class="col-sm-8">
                        <select name="defaultShiftId" class="form-control m-b" required>
                            <option value="">请选择默认班次</option>
                            <option th:each="shift : ${shifts}" th:value="${shift.shiftId}"
                                    th:selected="${employeeSetting.defaultShiftId != null and employeeSetting.defaultShiftId == shift.shiftId}"
                                    th:text="${shift.shiftName + ' (' + shift.shiftCode + ')'}"></option>
                        </select>
                        <span class="help-block m-b-none"><i class="fa fa-info-circle"></i> 默认班次必须是正常工作班次，不能选择休息班次。</span>
                    </div>
                </div>
            </div>
        </div>

        <h4 class="form-header h4">备注</h4>
        <div class="row">
            <div class="col-sm-12">
                <div class="form-group">
                    <label class="col-xs-2 control-label">备注：</label>
                    <div class="col-xs-10">
                        <textarea name="remark" maxlength="500" class="form-control" rows="3" th:text="*{remark}"></textarea>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>

<div class="row">
    <div class="col-sm-offset-5 col-sm-10">
        <button type="button" class="btn btn-sm btn-primary" onclick="submitHandler()"><i class="fa fa-check"></i> 保存</button>&nbsp;
        <button type="button" class="btn btn-sm btn-danger" onclick="closeItem()"><i class="fa fa-reply-all"></i> 关闭</button>
    </div>
</div>

<th:block th:include="include :: footer"/>
<th:block th:include="include :: datetimepicker-js"/>
<script>
    var prefix = ctx + "hr/employeeSetting";

    $(function () {
        $("#rotationAnchorDate").datetimepicker({
            format: "yyyy-mm-dd",
            minView: "month",
            autoclose: true
        });

        $("#form-employee-setting-edit").validate({
            onkeyup: false,
            focusCleanup: true
        });

        $("#attendanceEnabledSwitch").on("change", function () {
            $("#attendanceEnabled").val($(this).is(":checked") ? "1" : "0");
        });
    });

    function submitHandler() {
        if (!$.validate.form()) {
            return;
        }
        if ($.common.isEmpty($("select[name='defaultShiftId']").val())) {
            $.modal.alertWarning("请选择默认班次");
            return;
        }
        var data = $("#form-employee-setting-edit").serializeArray();
        $.operate.saveTab(prefix + "/edit", data);
    }
</script>
</body>
</html>
