<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('组织员工')"/>
</head>
<body class="gray-bg">
<div class="container-div">
    <div class="row">
        <div class="col-sm-12 search-collapse">
            <form id="employee-form">
                <div class="select-list">
                    <ul>
                        <li>工号：<input type="text" name="employeeNo"/></li>
                        <li>姓名：<input type="text" name="userName"/></li>
                        <li>工种：<input type="text" name="jobType"/></li>
                        <li>
                            在职状态：
                            <select name="workStatus">
                                <option value="">所有</option>
                                <option value="0">在职</option>
                                <option value="1">离职</option>
                            </select>
                        </li>
                        <li>
                            <a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i class="fa fa-search"></i>&nbsp;搜索</a>
                            <a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i class="fa fa-refresh"></i>&nbsp;重置</a>
                        </li>
                    </ul>
                </div>
            </form>
        </div>

        <div class="btn-group-sm" id="toolbar" role="group">
            <a class="btn btn-success" onclick="$.operate.addTab()" shiro:hasPermission="hr:employee:add">
                <i class="fa fa-plus"></i> 新增
            </a>
            <a class="btn btn-primary single disabled" onclick="$.operate.editTab()" shiro:hasPermission="hr:employee:edit">
                <i class="fa fa-edit"></i> 修改
            </a>
            <a class="btn btn-danger multiple disabled" onclick="$.operate.removeAll()" shiro:hasPermission="hr:employee:remove">
                <i class="fa fa-remove"></i> 删除
            </a>
            <a class="btn btn-warning" onclick="$.table.exportExcel()" shiro:hasPermission="hr:employee:export">
                <i class="fa fa-download"></i> 导出
            </a>
        </div>

        <div class="col-sm-12 select-table table-striped">
            <table id="bootstrap-table"></table>
        </div>
    </div>
</div>

<th:block th:include="include :: footer"/>
<script th:inline="javascript">
    var editFlag = [[${@permission.hasPermi('hr:employee:edit')}]];
    var removeFlag = [[${@permission.hasPermi('hr:employee:remove')}]];
    var prefix = ctx + "hr/employee";

    $(function () {
        var options = {
            url: prefix + "/list",
            createUrl: prefix + "/add",
            updateUrl: prefix + "/edit/{id}",
            removeUrl: prefix + "/remove",
            exportUrl: prefix + "/export",
            modalName: "员工",
            columns: [{checkbox: true},
                {field: 'hrEmployeeId', title: 'ID'},
                {field: 'employeeNo', title: '工号', sortable: true,
                    formatter: function (value, row) {
                        return '<a href="javascript:void(0)" onclick="$.operate.editTab(\'' + row.hrEmployeeId + '\')">' + (value || '-') + '</a>';
                    }
                },
                {field: 'userName', title: '姓名'},
                {field: 'deptName', title: '部门'},
                {field: 'jobType', title: '工种'},
                {field: 'attendEnabled', title: '参与考勤', formatter: function (value) { return value === '1' ? '是' : '否'; }},
                {field: 'workStatus', title: '在职状态', formatter: function (value) { return value === '0' ? '在职' : '离职'; }},
                {field: 'joinDate', title: '入职日期'},
                {
                    title: '操作',
                    align: 'center',
                    formatter: function (value, row) {
                        var actions = [];
                        actions.push('<a class="btn btn-success btn-xs ' + editFlag + '" href="javascript:void(0)" onclick="$.operate.editTab(\'' + row.hrEmployeeId + '\')"><i class="fa fa-edit"></i>编辑</a> ');
                        actions.push('<a class="btn btn-danger btn-xs ' + removeFlag + '" href="javascript:void(0)" onclick="$.operate.remove(\'' + row.hrEmployeeId + '\')"><i class="fa fa-remove"></i>删除</a>');
                        return actions.join('');
                    }
                }]
        };
        $.table.init(options);
    });
</script>
</body>
</html>
