<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro"
      th:with="scheduleModeList=${@dict.getType('hr_shift_schedule_mode')}">
<head>
    <th:block th:include="include :: header('班次管理')"/>
</head>
<body class="gray-bg">
<div class="container-div">
    <div class="row">
        <div class="col-sm-12 search-collapse">
            <form id="shift-form">
                <div class="select-list">
                    <ul>
                        <li>
                            <label>编码：</label>
                            <input type="text" name="shiftCode"/>
                        </li>
                        <li>
                            <label>班次：</label>
                            <input type="text" name="shiftName"/>
                        </li>
                        <li>
                            <input type="hidden" id="queryPostType" name="postType"/>
                            <label>岗位：</label>
                            <div class="input-group" style="width: 200px;">
                                <input type="text" id="queryPostTypeName" class="form-control" placeholder="请选择岗位" onclick="selectQueryPostTree()" readonly>
                                <span class="input-group-addon"><i class="fa fa-search"></i></span>
                            </div>
                        </li>
                        <li>
                            <label>状态：</label>
                            <select name="status" th:with="type=${@dict.getType('sys_normal_disable')}">
                                <option value="">全部</option>
                                <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}"></option>
                            </select>
                        </li>
                        <li>
                            <a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search('shift-form')">
                                <i class="fa fa-search"></i>&nbsp;搜索
                            </a>
                            <a class="btn btn-warning btn-rounded btn-sm" onclick="resetQuery()">
                                <i class="fa fa-refresh"></i>&nbsp;重置
                            </a>
                        </li>
                    </ul>
                </div>
            </form>
        </div>

        <div class="btn-group-sm" id="toolbar" role="group">
            <a class="btn btn-success" onclick="$.operate.addTab()" shiro:hasPermission="hr:shift:add">
                <i class="fa fa-plus"></i> 新增
            </a>
            <a class="btn btn-primary single disabled" onclick="$.operate.editTab()" shiro:hasPermission="hr:shift:edit">
                <i class="fa fa-edit"></i> 修改
            </a>
            <a class="btn btn-danger multiple disabled" onclick="$.operate.removeAll()" shiro:hasPermission="hr:shift:remove">
                <i class="fa fa-remove"></i> 删除
            </a>
            <a class="btn btn-warning" onclick="$.table.exportExcel()" shiro:hasPermission="hr:shift:export">
                <i class="fa fa-download"></i> 导出
            </a>
        </div>

        <div class="col-sm-12 select-table table-striped">
            <table id="bootstrap-table"></table>
        </div>
    </div>
</div>
<th:block th:include="include :: footer"/>
<script th:inline="javascript">
    var editFlag = [[${@permission.hasPermi('hr:shift:edit')}]];
    var removeFlag = [[${@permission.hasPermi('hr:shift:remove')}]];
    var statusDatas = [[${@dict.getType('sys_normal_disable')}]];
    var scheduleModeDatas = [[${@dict.getType('hr_shift_schedule_mode')}]];
    var prefix = ctx + "hr/shift";

    $(function () {
        var options = {
            url: prefix + "/list",
            createUrl: prefix + "/add",
            updateUrl: prefix + "/edit/{id}",
            removeUrl: prefix + "/remove",
            exportUrl: prefix + "/export",
            modalName: "班次",
            formId: "shift-form",
            sortName: "shiftId",
            sortOrder: "desc",
            uniqueId: "shiftId",
            columns: [{
                checkbox: true
            }, {
                field: "shiftId",
                title: "班次ID",
                visible: false,
                switchable: false
            }, {
                field: "shiftCode",
                title: "编码",
                sortable: true,
                formatter: function (value, row) {
                    return '<a href="javascript:void(0)" onclick="$.operate.editTab(\'' + row.shiftId + '\')">' + value + '</a>';
                }
            }, {
                field: "shiftName",
                title: "班次",
                sortable: true
            }, {
                field: "postType",
                title: "岗位",
                formatter: function (value) {
                    return formatPostType(value);
                }
            }, {
                field: "workdayMask",
                title: "上班日",
                formatter: function (value) {
                    return formatWorkdayMask(value);
                }
            }, {
                field: "scheduleMode",
                title: "排班模式",
                formatter: function (value) {
                    return $.table.selectDictLabel(scheduleModeDatas, value);
                }
            }, {
                field: "rotationWorkDays",
                title: "轮班规则",
                formatter: function (value, row) {
                    if (row.scheduleMode !== "ROTATION") {
                        return "-";
                    }
                    return (row.rotationWorkDays || 0) + "上" + (row.rotationRestDays || 0) + "休";
                }
            }, {
                field: "periodCount",
                title: "班段数",
                align: "center"
            }, {
                field: "punchCount",
                title: "打卡次数",
                align: "center",
                formatter: function (value) {
                    if (value === null || value === undefined) {
                        return '-';
                    }
                    return value + '卡';
                }
            }, {
                field: "periodSummary",
                title: "班段摘要",
                formatter: function (value) {
                    return $.common.isEmpty(value) ? '-' : value;
                }
            }, {
                field: "status",
                title: "状态",
                align: "center",
                formatter: function (value) {
                    return $.table.selectDictLabel(statusDatas, value);
                }
            }, {
                title: "操作",
                align: "center",
                formatter: function (value, row) {
                    var actions = [];
                    actions.push('<a class="btn btn-success btn-xs ' + editFlag + '" href="javascript:void(0)" onclick="$.operate.editTab(\'' + row.shiftId + '\')"><i class="fa fa-edit"></i>编辑</a> ');
                    actions.push('<a class="btn btn-danger btn-xs ' + removeFlag + '" href="javascript:void(0)" onclick="$.operate.remove(\'' + row.shiftId + '\')"><i class="fa fa-remove"></i>删除</a>');
                    return actions.join('');
                }
            }]
        };
        $.table.init(options);
    });

    function formatWorkdayMask(mask) {
        if ($.common.isEmpty(mask) || mask.length !== 7) {
            return '-';
        }
        var names = ['一', '二', '三', '四', '五', '六', '日'];
        var list = [];
        for (var i = 0; i < 7; i++) {
            if (mask.charAt(i) === '1') {
                list.push('周' + names[i]);
            }
        }
        return list.length === 0 ? '休息' : list.join('、');
    }

    function formatPostType(value) {
        if ($.common.isEmpty(value)) {
            return '-';
        }
        var idx = value.indexOf('|');
        return idx > -1 ? value.substring(idx + 1) : value;
    }

    function selectQueryPostTree() {
        $.modal.openOptions({
            title: "选择岗位",
            width: "380",
            url: prefix + "/selectPostTree/0",
            btn: ['<i class="fa fa-check"></i> 确认', '<i class="fa fa-trash-o"></i> 清除', '<i class="fa fa-close"></i> 关闭'],
            btn2: function (index) {
                $("#queryPostType").val("");
                $("#queryPostTypeName").val("");
                $.modal.close(index);
            },
            callBack: doQueryPostSubmit
        });
    }

    function doQueryPostSubmit(index) {
        var body = $.modal.getChildFrame(index);
        var postId = body.find("#treeId").val();
        var postName = body.find("#treeName").val();
        $("#queryPostType").val(postId + "|" + postName);
        $("#queryPostTypeName").val(postName);
        $.modal.close(index);
    }

    function resetQuery() {
        $("#shift-form")[0].reset();
        $("#queryPostType").val("");
        $("#queryPostTypeName").val("");
        $.table.search("shift-form");
    }
</script>
</body>
</html>
