<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('排班管理')"/>
</head>
<body class="gray-bg">
<div class="container-div">
    <div class="row">
        <div class="col-sm-12 search-collapse">
            <form id="schedule-form">
                <div class="select-list">
                    <ul>
                        <li>
                            <input type="hidden" id="queryUserId" name="userId"/>
                            <label>员工：</label>
                            <div class="input-group" style="width: 200px;">
                                <input type="text" id="queryUserName" class="form-control" placeholder="请选择员工" onclick="selectQueryUser()" readonly>
                                <span class="input-group-addon"><i class="fa fa-search"></i></span>
                            </div>
                        </li>
                        <li>
                            <input type="hidden" id="queryDeptId" name="deptId"/>
                            <label>部门：</label>
                            <div class="input-group" style="width: 200px;">
                                <input type="text" id="queryDeptName" class="form-control" placeholder="请选择部门" onclick="selectQueryDeptTree()" readonly>
                                <span class="input-group-addon"><i class="fa fa-search"></i></span>
                            </div>
                        </li>
                        <li>
                            <label>排班月份：</label>
                            <input type="month" id="scheduleMonth" class="form-control" style="width: 160px; display: inline-block;">
                        </li>
                        <li>
                            <label>覆盖已排：</label>
                            <label class="toggle-switch switch-solid" style="margin-top: 4px;">
                                <input type="checkbox" id="overwriteGenerate" checked>
                                <span></span>
                            </label>
                        </li>
                        <li class="select-time">
                            <label>排班日期：</label>
                            <input type="text" class="time-input" id="startDate" placeholder="开始日期" name="params[beginTime]"/>
                            <span>-</span>
                            <input type="text" class="time-input" id="endDate" placeholder="结束日期" name="params[endTime]"/>
                        </li>
                        <li>
                            <a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i class="fa fa-search"></i>&nbsp;搜索</a>
                            <a class="btn btn-warning btn-rounded btn-sm" onclick="resetQuery()"><i class="fa fa-refresh"></i>&nbsp;重置</a>
                        </li>
                    </ul>
                </div>
            </form>
        </div>

        <div class="btn-group-sm" id="toolbar" role="group">
            <a class="btn btn-info" href="javascript:void(0)" onclick="generateMonthly()" shiro:hasPermission="hr:schedule:add">
                <i class="fa fa-calendar-plus-o"></i> 生成月排班
            </a>
            <a class="btn btn-success" onclick="$.operate.addTab()" shiro:hasPermission="hr:schedule:add">
                <i class="fa fa-plus"></i> 新增
            </a>
            <a class="btn btn-primary single disabled" onclick="$.operate.editTab()" shiro:hasPermission="hr:schedule:edit">
                <i class="fa fa-edit"></i> 修改
            </a>
            <a class="btn btn-danger multiple disabled" onclick="$.operate.removeAll()" shiro:hasPermission="hr:schedule:remove">
                <i class="fa fa-remove"></i> 删除
            </a>
            <a class="btn btn-warning" onclick="$.table.exportExcel()" shiro:hasPermission="hr:schedule:export">
                <i class="fa fa-download"></i> 导出
            </a>
        </div>

        <div class="col-sm-12 select-table table-striped">
            <table id="bootstrap-table"></table>
        </div>
    </div>
</div>

<th:block th:include="include :: footer"/>
<script th:inline="javascript">
    var editFlag = [[${@permission.hasPermi('hr:schedule:edit')}]];
    var removeFlag = [[${@permission.hasPermi('hr:schedule:remove')}]];
    var prefix = ctx + "hr/schedule";

    $(function () {
        var now = new Date();
        var m = now.getMonth() + 1;
        $("#scheduleMonth").val(now.getFullYear() + "-" + (m < 10 ? "0" + m : m));

        var options = {
            url: prefix + "/list",
            createUrl: prefix + "/add",
            updateUrl: prefix + "/edit/{id}",
            removeUrl: prefix + "/remove",
            exportUrl: prefix + "/export",
            modalName: "排班",
            sortName: "workDate",
            sortOrder: "desc",
            columns: [{checkbox: true},
                {field: 'scheduleId', title: 'ID'},
                {field: 'userId', title: '员工ID'},
                {field: 'userName', title: '姓名'},
                {field: 'deptName', title: '部门'},
                {field: 'workDate', title: '排班日期', sortable: true},
                {field: 'shiftName', title: '班次'},
                {field: 'restType', title: '休息类型'},
                {field: 'scheduleRemark', title: '备注'},
                {
                    title: '操作',
                    align: 'center',
                    formatter: function (value, row) {
                        var actions = [];
                        actions.push('<a class="btn btn-success btn-xs ' + editFlag + '" href="javascript:void(0)" onclick="$.operate.editTab(\'' + row.scheduleId + '\')"><i class="fa fa-edit"></i>编辑</a> ');
                        actions.push('<a class="btn btn-danger btn-xs ' + removeFlag + '" href="javascript:void(0)" onclick="$.operate.remove(\'' + row.scheduleId + '\')"><i class="fa fa-remove"></i>删除</a>');
                        return actions.join('');
                    }
                }]
        };
        $.table.init(options);
    });

    function generateMonthly() {
        var month = $("#scheduleMonth").val();
        if ($.common.isEmpty(month)) {
            $.modal.alertWarning("请先选择排班月份");
            return;
        }
        var data = {
            month: month,
            deptId: $("#queryDeptId").val(),
            userId: $("#queryUserId").val(),
            overwrite: $("#overwriteGenerate").is(":checked")
        };
        $.modal.confirm("确认按当前筛选条件生成 " + month + " 月排班吗？", function () {
            $.operate.post(prefix + "/generateMonthly", data);
        });
    }

    function selectQueryDeptTree() {
        var deptId = $.common.isEmpty($("#queryDeptId").val()) ? "100" : $("#queryDeptId").val();
        var url = prefix + "/selectDeptTree/" + deptId;
        var btn = ['<i class="fa fa-check"></i> 确认', '<i class="fa fa-trash-o"></i> 清除', '<i class="fa fa-close"></i> 关闭'];
        var options = {
            title: "选择部门",
            width: "380",
            url: url,
            btn: btn,
            btn2: function (index) {
                $("#queryDeptId").val("");
                $("#queryDeptName").val("");
                $("#queryUserId").val("");
                $("#queryUserName").val("");
                $.modal.close(index);
            },
            callBack: doQueryDeptSubmit
        };
        $.modal.openOptions(options);
    }

    function doQueryDeptSubmit(index) {
        var body = $.modal.getChildFrame(index);
        $("#queryDeptId").val(body.find("#treeId").val());
        $("#queryDeptName").val(body.find("#treeName").val());
        $("#queryUserId").val("");
        $("#queryUserName").val("");
        $.modal.close(index);
    }

    function selectQueryUser() {
        var deptId = $("#queryDeptId").val();
        var url = prefix + "/selectUser";
        if (!$.common.isEmpty(deptId)) {
            url += "?deptId=" + deptId;
        }
        var options = {
            title: "选择员工",
            width: "1000",
            url: url,
            callBack: doQueryUserSubmit
        };
        $.modal.openOptions(options);
    }

    function doQueryUserSubmit(index) {
        var body = $.modal.getChildFrame(index);
        var userId = body.find("#selectedUserId").val();
        if ($.common.isEmpty(userId)) {
            $.modal.alertWarning("请选择员工");
            return;
        }
        $("#queryUserId").val(userId);
        $("#queryUserName").val(body.find("#selectedUserName").val());
        $("#queryDeptId").val(body.find("#selectedDeptId").val());
        $("#queryDeptName").val(body.find("#selectedDeptName").val());
        $.modal.close(index);
    }

    function resetQuery() {
        resetDate();
        $("#schedule-form")[0].reset();
        $("#queryUserId").val("");
        $("#queryDeptId").val("");
        var now = new Date();
        var m = now.getMonth() + 1;
        $("#scheduleMonth").val(now.getFullYear() + "-" + (m < 10 ? "0" + m : m));
        $("#overwriteGenerate").prop("checked", true);
        $.table.search();
    }
</script>
</body>
</html>
