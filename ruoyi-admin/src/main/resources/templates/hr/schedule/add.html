<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('新增排班')"/>
    <th:block th:include="include :: datetimepicker-css"/>
</head>
<body>
<div class="main-content">
    <form id="form-schedule-add" class="form-horizontal">
        <input type="hidden" id="userId" name="userId"/>
        <input type="hidden" id="deptId" name="deptId"/>

        <h4 class="form-header h4">排班信息</h4>
        <div class="row">
            <div class="col-sm-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label is-required">员工：</label>
                    <div class="col-sm-8">
                        <div class="input-group">
                            <input type="text" id="userNameDisplay" class="form-control" placeholder="请选择员工"
                                   onclick="selectUser()" readonly required>
                            <span class="input-group-addon"><i class="fa fa-search"></i></span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-sm-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label is-required">部门：</label>
                    <div class="col-sm-8">
                        <div class="input-group">
                            <input type="text" id="deptNameDisplay" class="form-control" placeholder="请选择部门"
                                   onclick="selectDeptTree()" readonly required>
                            <span class="input-group-addon"><i class="fa fa-search"></i></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-sm-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label is-required">排班日期：</label>
                    <div class="col-sm-8">
                        <input name="workDate" type="text" class="form-control time-input" placeholder="yyyy-MM-dd" required>
                    </div>
                </div>
            </div>
            <div class="col-sm-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label">班次：</label>
                    <div class="col-sm-8">
                        <select name="shiftId" class="form-control m-b">
                            <option value="">请选择班次</option>
                            <option th:each="shift:${shifts}" th:value="${shift.shiftId}" th:text="${shift.shiftName + ' (' + shift.shiftCode + ')'}"></option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-sm-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label">休息类型：</label>
                    <div class="col-sm-8">
                        <select name="restType" class="form-control m-b">
                            <option value="">正常出勤</option>
                            <option value="REST">休息</option>
                            <option value="HALF_REST">半天休</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="col-sm-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label">覆盖同日排班：</label>
                    <div class="col-sm-8">
                        <label class="toggle-switch switch-solid">
                            <input type="checkbox" id="overwrite" checked>
                            <span></span>
                        </label>
                    </div>
                </div>
            </div>
        </div>

        <h4 class="form-header h4">备注</h4>
        <div class="row">
            <div class="col-sm-12">
                <div class="form-group">
                    <label class="col-xs-2 control-label">备注：</label>
                    <div class="col-xs-10">
                        <textarea name="scheduleRemark" maxlength="500" class="form-control" rows="3"></textarea>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>

<div class="row">
    <div class="col-sm-offset-5 col-sm-10">
        <button type="button" class="btn btn-sm btn-primary" onclick="submitHandler()"><i class="fa fa-check"></i> 保存</button>&nbsp;
        <button type="button" class="btn btn-sm btn-danger" onclick="closeItem()"><i class="fa fa-reply-all"></i> 关闭</button>
    </div>
</div>

<th:block th:include="include :: footer"/>
<th:block th:include="include :: datetimepicker-js"/>
<script>
    var prefix = ctx + "hr/schedule";

    $(function () {
        $("input[name='workDate']").datetimepicker({
            format: "yyyy-mm-dd",
            minView: "month",
            autoclose: true
        });

        $("#form-schedule-add").validate({
            onkeyup: false,
            focusCleanup: true
        });
    });

    function selectDeptTree() {
        var deptId = $.common.isEmpty($("#deptId").val()) ? "100" : $("#deptId").val();
        var url = prefix + "/selectDeptTree/" + deptId;
        var btn = ['<i class="fa fa-check"></i> 确认', '<i class="fa fa-trash-o"></i> 清除', '<i class="fa fa-close"></i> 关闭'];
        var options = {
            title: "选择部门",
            width: "380",
            url: url,
            btn: btn,
            btn2: function (index) {
                $("#deptId").val("");
                $("#deptNameDisplay").val("");
                $("#userId").val("");
                $("#userNameDisplay").val("");
                $.modal.close(index);
            },
            callBack: doDeptSubmit
        };
        $.modal.openOptions(options);
    }

    function doDeptSubmit(index) {
        var body = $.modal.getChildFrame(index);
        $("#deptId").val(body.find("#treeId").val());
        $("#deptNameDisplay").val(body.find("#treeName").val());
        $("#userId").val("");
        $("#userNameDisplay").val("");
        $.modal.close(index);
    }

    function selectUser() {
        var deptId = $("#deptId").val();
        var url = prefix + "/selectUser";
        if (!$.common.isEmpty(deptId)) {
            url += "?deptId=" + deptId;
        }
        var options = {
            title: "选择员工",
            width: "1000",
            url: url,
            callBack: doUserSubmit
        };
        $.modal.openOptions(options);
    }

    function doUserSubmit(index) {
        var body = $.modal.getChildFrame(index);
        var userId = body.find("#selectedUserId").val();
        if ($.common.isEmpty(userId)) {
            $.modal.alertWarning("请选择员工");
            return;
        }
        $("#userId").val(userId);
        $("#userNameDisplay").val(body.find("#selectedUserName").val());
        $("#deptId").val(body.find("#selectedDeptId").val());
        $("#deptNameDisplay").val(body.find("#selectedDeptName").val());
        $.modal.close(index);
    }

    function submitHandler() {
        if (!$.validate.form()) {
            return;
        }
        if ($.common.isEmpty($("#userId").val())) {
            $.modal.alertWarning("请选择员工");
            return;
        }
        if ($.common.isEmpty($("#deptId").val())) {
            $.modal.alertWarning("请选择部门");
            return;
        }
        var data = $("#form-schedule-add").serializeArray();
        data.push({name: "overwrite", value: $("#overwrite").is(":checked")});
        $.operate.saveTab(prefix + "/add", data);
    }
</script>
</body>
</html>
