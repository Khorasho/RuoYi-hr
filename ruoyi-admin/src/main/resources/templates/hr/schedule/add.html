<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" th:with="restTypeList=${@dict.getType('hr_rest_type')}">
<head>
    <th:block th:include="include :: header('新增排班')"/>
    <th:block th:include="include :: datetimepicker-css"/>
</head>
<body class="white-bg">
<div class="main-content">
    <form id="form-schedule-add" class="form-horizontal">
        <input type="hidden" id="userId" name="userId"/>
        <input type="hidden" id="deptId" name="deptId"/>

        <h4 class="form-header h4">排班信息</h4>
        <div class="row">
            <div class="col-sm-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label is-required">员工：</label>
                    <div class="col-sm-8">
                        <div class="input-group">
                            <input type="text" id="userDisplay" class="form-control" placeholder="请选择员工"
                                   onclick="selectUser()" readonly required>
                            <span class="input-group-addon"><i class="fa fa-search"></i></span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-sm-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label is-required">部门：</label>
                    <div class="col-sm-8">
                        <input type="text" id="deptNameDisplay" class="form-control" placeholder="选择员工后自动带出" readonly required>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-sm-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label is-required">排班日期：</label>
                    <div class="col-sm-8">
                        <input name="workDate" type="text" class="form-control time-input" placeholder="yyyy-MM-dd" required>
                    </div>
                </div>
            </div>
            <div class="col-sm-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label is-required">班次：</label>
                    <div class="col-sm-8">
                        <select name="shiftId" class="form-control m-b" required id="shiftId">
                            <option value="">请选择班次</option>
                            <option th:each="shift : ${shifts}" th:value="${shift.shiftId}"
                                    th:attr="data-rest=${shift.isRestShift}"
                                    th:text="${shift.shiftName + ' (' + shift.shiftCode + ')'}"></option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-sm-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label">休息类型：</label>
                    <div class="col-sm-8">
                        <select name="restType" class="form-control m-b" id="restType">
                            <option th:each="dict : ${restTypeList}" th:value="${dict.dictValue}" th:text="${dict.dictLabel}"></option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="col-sm-6">
                <div class="form-group">
                    <label class="col-sm-4 control-label">覆盖同日排班：</label>
                    <div class="col-sm-8">
                        <label class="toggle-switch switch-solid">
                            <input type="checkbox" id="overwrite">
                            <span></span>
                        </label>
                    </div>
                </div>
            </div>
        </div>

        <h4 class="form-header h4">备注</h4>
        <div class="row">
            <div class="col-sm-12">
                <div class="form-group">
                    <label class="col-xs-2 control-label">备注：</label>
                    <div class="col-xs-10">
                        <textarea name="scheduleRemark" maxlength="500" class="form-control" rows="3"></textarea>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>

<div class="row">
    <div class="col-sm-offset-5 col-sm-10">
        <button type="button" class="btn btn-sm btn-primary" onclick="submitHandler()"><i class="fa fa-check"></i> 保存</button>&nbsp;
        <button type="button" class="btn btn-sm btn-danger" onclick="closeItem()"><i class="fa fa-reply-all"></i> 关闭</button>
    </div>
</div>

<th:block th:include="include :: footer"/>
<th:block th:include="include :: datetimepicker-js"/>
<script>
    var prefix = ctx + "hr/schedule";

    $(function () {
        $("input[name='workDate']").datetimepicker({
            format: "yyyy-mm-dd",
            minView: "month",
            autoclose: true
        });

        $("#form-schedule-add").validate({
            onkeyup: false,
            focusCleanup: true
        });

        $("#shiftId").on("change", function () {
            syncRestType($(this));
        });
        if ($.common.isEmpty($("#restType").val())) {
            $("#restType").val("WORK");
        }
    });

    function selectUser() {
        $.modal.openOptions({
            title: "选择员工",
            width: "1000",
            url: prefix + "/selectUser",
            callBack: doUserSubmit
        });
    }

    function doUserSubmit(index, layero) {
        var rows = layero.find("iframe")[0].contentWindow.getSelections();
        if (!rows || rows.length === 0) {
            $.modal.alertWarning("请选择员工");
            return;
        }
        fillUserInfo(rows[0]);
        $.modal.close(index);
    }

    function fillUserInfo(row) {
        var deptId = row.deptId || "";
        var deptName = row.dept ? (row.dept.deptName || "") : "";
        $("#userId").val(row.userId || "");
        $("#deptId").val(deptId);
        $("#userDisplay").val((row.loginName || "") + " / " + (row.userName || ""));
        $("#deptNameDisplay").val(deptName);
    }

    function syncRestType($shift) {
        var isRest = $shift.find("option:selected").data("rest");
        if (isRest === "1" || isRest === 1) {
            $("#restType").val("REST");
        } else if ($("#restType").val() === "REST") {
            $("#restType").val("WORK");
        }
    }

    function submitHandler() {
        if (!$.validate.form()) {
            return;
        }
        if ($.common.isEmpty($("#userId").val())) {
            $.modal.alertWarning("请选择员工");
            return;
        }
        if ($.common.isEmpty($("#deptId").val())) {
            $.modal.alertWarning("员工部门不能为空");
            return;
        }
        if ($.common.isEmpty($("#shiftId").val())) {
            $.modal.alertWarning("请选择班次");
            return;
        }
        if ($("#restType").val() === "WORK") {
            $("#restType").val("");
        }
        var data = $("#form-schedule-add").serializeArray();
        data.push({name: "overwrite", value: $("#overwrite").is(":checked")});
        $.operate.saveTab(prefix + "/add", data);
    }
</script>
</body>
</html>
