<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('考勤规则')"/>
</head>
<body class="gray-bg">
<div class="container-div">
    <div class="row">
        <div class="btn-group-sm" id="toolbar" role="group">
            <a class="btn btn-primary" href="javascript:void(0)" onclick="submitHandler()" shiro:hasPermission="hr:attendance:edit">
                <i class="fa fa-save"></i> 保存规则
            </a>
        </div>

        <div class="col-sm-12">
            <div class="ibox float-e-margins">
                <div class="ibox-title"><h5>考勤判定参数</h5></div>
                <div class="ibox-content">
                    <form id="form-rule" class="form-horizontal" th:object="${rule}">
                        <input type="hidden" name="ruleId" th:field="*{ruleId}">
                        <div class="form-group">
                            <label class="col-sm-2 control-label">迟到阈值(分钟)：</label>
                            <div class="col-sm-4">
                                <input type="number" min="0" name="lateMinutes" class="form-control" th:field="*{lateMinutes}" required>
                            </div>
                            <label class="col-sm-2 control-label">早退阈值(分钟)：</label>
                            <div class="col-sm-4">
                                <input type="number" min="0" name="earlyMinutes" class="form-control" th:field="*{earlyMinutes}" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-2 control-label">旷工容差(分钟)：</label>
                            <div class="col-sm-4">
                                <input type="number" min="0" name="absentMinutes" class="form-control" th:field="*{absentMinutes}" required>
                            </div>
                            <label class="col-sm-2 control-label">多次打卡策略：</label>
                            <div class="col-sm-4">
                                <select name="multiPunchStrategy" class="form-control m-b" th:field="*{multiPunchStrategy}">
                                    <option value="EARLIEST_IN_LATEST_OUT">最早上班 + 最晚下班</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-2 control-label">说明：</label>
                            <div class="col-sm-10">
                                <p class="form-control-static text-muted">
                                    该页面用于配置简化规则引擎参数。修改后建议执行“月重算”，确保考勤结果与规则一致。
                                </p>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<th:block th:include="include :: footer"/>
<script>
    var prefix = ctx + "hr/rule";

    $(function () {
        $("#form-rule").validate({
            onkeyup: false,
            focusCleanup: true
        });
    });

    function submitHandler() {
        if ($.validate.form()) {
            $.operate.save(prefix + "/edit", $("#form-rule").serialize());
        }
    }
</script>
</body>
</html>
